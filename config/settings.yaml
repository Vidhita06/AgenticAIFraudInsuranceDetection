# Central settings: paths and parameters shared by EDA, training and the agent.
random_state: 42

paths:
  raw: data/raw/fraud_oracle.csv
  augmented_train: data/processed/augmented_train_300k.csv
  real_train: data/processed/real_train.csv
  real_validation: data/processed/real_validation.csv
  real_test: data/processed/real_test.csv
  policy_rules: config/policy_rules.yaml
  # Tool 3 source: actual policy documents, one <PolicyNumber>.json each (none ship with the
  # repository; without them policy retrieval reports the claim-recorded attributes only).
  policy_store_dir: data/policies
  prompts_dir: config/prompts
  vector_store_dir: data/vector_store
  models_dir: models
  reports_dir: docs/report
  figures_dir: docs/report/figures
  tables_dir: docs/report/tables
  evaluation_results_dir: evaluation/results

data:
  target: FraudFound_P
  id_column: PolicyNumber
  origin_column: is_synthetic
  # Never model features: PolicyNumber perfectly separates real from synthetic rows.
  never_features: [PolicyNumber, is_synthetic]
  # Fully determined by other columns; kept for display only.
  display_only: [AgeOfPolicyHolder, PolicyType]
  # Under review until the Step A EDA.
  review_features: [RepNumber]
  real_policy_number_max: 15420
  invalid_policy_number: 1517

metrics:
  bootstrap_iterations: 2000
  ci_level: 0.95

decision:
  # Missed fraud : unnecessary investigation. Default first; others are reported.
  cost_ratios: [10, 5, 20]
  capacity_top_fraction: 0.10

retrieval:
  top_k: 5

agent:
  max_steps: 8
  # Evidence sources that must be present before reasoning. If the orchestrator LLM did not
  # call one, complete_investigation runs it (logged as `auto`, not as an agent choice). All
  # are local and deterministic. similar_claims and claim_history stay the agent's choice.
  required_tools: [fraud_score, shap_explanation, policy_retrieval, policy_verification, similar_claims]
  # A medium-band flag needs at least one of these reason codes, otherwise the guardrail
  # replaces it with the rule-based decision (unsupported_fraud_flag). Only information the
  # fraud model does NOT see: red flags, SHAP drivers and similar-claim fraud are model features
  # and do not separate fraud inside the medium band (docs/report/03b_medium_band_factors.md),
  # so they are rationale context, not triggers. A policy-condition FAIL flag is tagged
  # POLICY_CONDITION; a history contradiction is FRAUD_RISK.
  medium_band_concrete_factors: [POLICY_CONDITION_FAILED, CLAIM_RECORD_CONTRADICTION, HISTORY_CONTRADICTION]
  # STRONG_SHAP_DRIVER: a feature other than the red flags contributes at least this many log-odds.
  strong_shap_log_odds: 0.5

# Tool 6 source: an authorised claim-history file (CSV / JSONL with policy_id or customer_id,
# claim_id, claim_date, incident_type, status, outcome). The project data has none
# (PolicyNumber is unique per claim), so the tool reports `unavailable`.
claim_history:
  source: null

# SIMULATED reference database (docs/simulated_data_plan.md): illustrative policies, clauses and
# prior claims so Tools 3, 4 and 6 have data. Built by scripts/build_simulated_db.py; never
# derived from the fraud label. enabled: false = tools behave exactly as without it. The
# evaluation sets the mode per run (--simulated-data off|on|both).
simulated_data:
  enabled: false
  path: data/simulated/insurance.db
  clauses: config/simulated_policy_clauses.yaml
  seed: 42
  write_runtime_tables: true

# Model inputs (decided in the Step A EDA, docs/report/01_eda_report.md §5).
# Excluded: PolicyNumber, is_synthetic (leakage); PolicyType, AgeOfPolicyHolder (display only);
# RepNumber (no signal); Sex, MaritalStatus (fairness, no gain); raw Age (-> age_band,
# age_missing); MonthClaimed, DayOfWeekClaimed, WeekOfMonthClaimed (-> lag/weekend features).
features:
  nominal: [Fault, BasePolicy, VehicleCategory, AgentType, AccidentArea, Make,
            PoliceReportFiled, WitnessPresent]
  cyclic: [Month, DayOfWeek]
  ordinal: [VehiclePrice, Days_Policy_Accident, Days_Policy_Claim, PastNumberOfClaims,
            AgeOfVehicle, NumberOfSuppliments, AddressChange_Claim, NumberOfCars, age_band]
  numeric: [Deductible, DriverRating, Year, WeekOfMonth, claim_lag_weeks, claim_lag_months]
  binary: [age_missing, early_policy_incident, price_extreme, policyholder_fault,
           liability_only, accident_weekend, claim_weekend]
  red_flags: true            # one indicator per red flag + weighted red-flag score
  consistency_count: true    # number of failed consistency rules (V04-V12)
  rare_category_min_frequency: 20
  fairness_groups: [Sex, MaritalStatus, age_band]

training:
  synthetic_weights: [1.0, 0.3, 0.1]
  synthetic_fractions: [0.0, 0.1, 0.25, 0.5, 1.0]
  default_synthetic_weight: 0.3
  fast_mode_rows: 20000

# Claude API list prices (USD per million tokens), used for cost estimates and reports.
# Thinking tokens are billed as output tokens.
llm_pricing_usd_per_mtok:
  claude-sonnet-5-5: {input: 2.0, output: 10.0}
  claude-opus-5-5: {input: 4.0, output: 20.0}
  claude-haiku-4-5: {input: 1.0, output: 5.0}
  claude-haiku-4-5-20251001: {input: 1.0, output: 5.0}

evaluation:
  pilot_claims: 5             # validation claims for the measured-cost pilot
  legit_per_fraud: 1          # final sample: all test frauds + this many legit per fraud
  consistency_claims: 20      # re-run this many claims...
  consistency_runs: 3         # ...this many times in total
  judge_claims: 40            # LLM-as-judge rubric on this many rationales
  manual_review_claims: 20    # exported for hand review
  # Static estimate assumptions (replaced by measured values once a pilot has run)
  est_output_tokens_agent_call: 900
  est_output_tokens_synthesis: 1500
  est_agent_calls_per_claim: 3
  est_safety_margin: 1.3
